<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eBay Lister</title>
<style>

.price{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}

</style></head><body><main>

<h2>2. Listing options</h2>
<section class="card"><div id="opts"></div><p class="small mute">Applied to every item identified now. You can change them per item below.</p>
<button class="pri" id="identify">Identify items</button> <span class="mute" id="busy"></span></section>
